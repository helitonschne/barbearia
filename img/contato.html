<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Produtos - Barbearia Alura</title>
        
        <link rel="stylesheet" href="reset.css">

        <link rel="stylesheet" href="contato.css">
    </head>
    <body>
        <header>
            <div class="caixa">
                <h1><img src="img/logo.png"></h1>

                <nav>
                    <ul>
                        <li><a href="index.html">Início</a></li>
                        <li><a href="produtos.html">Produtos</a></li>
                        <li><a href="contato.html">Contato</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <form>
                <label for="nomesobrenome">Nome e sobrenome</label>
                <input type="text" id="nomesobrenome" placeholder="Digite seu nome e sobrenome" class="input-padrao" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="email@dominio.com" class="input-padrao">

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(43) 99999-9999" class="input-padrao" required>

                <label for="mensagem">Mensagem</label>
                <textarea cols="70" rows="10" id="mensagem" placeholder="Digite sua mensagem" class="input-padrao"></textarea>

                <div>
                    <p>Como prefere o nosso contato?</p>
                    <label for="radio-email">
                        <input type="radio" name="contato" value="email" id="radio-email">
                        E-mail
                    </label>
                    
                    <label for="radio-telefone">
                        <input type="radio" name="contato" value="telefone" id="radio-telefone">
                        Telefone
                    </label>
                    
                    <label for="radio-whatsapp">
                        <input type="radio" name="contato" value="whatsapp" id="radio-whatsapp">
                        WhatsApp
                    </label>
                    
                </div>

                <div>
                    <p>Qual horário prefere ser atendido?</p>
                    <select>
                        <option>Manhã</option>
                        <option>Tarde</option>
                        <option>Noite</option>
                    </select>
                </div>

                <label class="input-padrao"><input type="checkbox">Gostaria de receber nossas novidades por email?</label>

                <input type="submit" value="Enviar formulário">
            </form>
        </main>

       <footer>
            <img src="img/logo-branco.png">
            <p class="copy">&copy; Copyright 2026 - Barbearia Alura</p>
        </footer>
    </body>
</html>
